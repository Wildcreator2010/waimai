name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  meta:
    name: 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/version.mjs

  server:
    name: 服务端（单测 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  web:
    name: Web 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  android:
    name: Android debug 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # 与本地/Android Studio 验证一致（项目 target 仍为 17）
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # 默认还会装已下架的 'tools' 包，导致 CI 失败；只保留 platform-tools
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x android/gradlew
      # 不使用 setup-gradle 的共享缓存：CI 上缓存的依赖元数据曾导致 KSP 解析失败
      - run: ./gradlew clean assembleDebug --no-daemon --no-build-cache -Pkotlin.incremental=false
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  docker:
    name: 服务端与 Web 镜像
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile.online -t meal-reminder-server:ci server
      - run: docker build -f web/Dockerfile -t meal-reminder-web:ci web
