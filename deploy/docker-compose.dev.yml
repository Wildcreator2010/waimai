name: meal-reminder-dev

# 本地开发用：只起一个 Postgres（e2e 测试与手工联调共用），端口 5433 避开已有实例。
services:
  db:
    image: postgres:16-alpine
    container_name: meal-reminder-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meal
      POSTGRES_PASSWORD: meal
      POSTGRES_DB: meal_test
      TZ: Asia/Shanghai
    ports:
      - '5433:5432'
    volumes:
      - dev-db-data:/var/lib/postgresql/data

volumes:
  dev-db-data:
