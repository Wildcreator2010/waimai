server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/reminders/:id 这类前端路由直接刷新也能命中
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 注意：/api 由 Caddy 直接反代到 server，不经过这里。
    # 不要在这里写 proxy_pass http://server:8787 —— nginx 启动时会解析上游，
    # 解析不到会直接退出（standalone 起 web 容器时会挂）。

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
